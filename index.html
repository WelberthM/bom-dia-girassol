<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bom dia!</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="sunflower-wrapper" id="sunflower-wrapper">
            <div class="css-sunflower" id="sunflower">
                <div class="petals" id="petals"></div>
                <div class="center"></div>
            </div>
        </div>

        <div class="message-container" id="message-container">
            <h1 class="title">Bom dia, meu bem!</h1>
            <p class="subtitle">Que o seu dia seja tão brilhante e lindo quanto este girassol.</p>
            <p class="subtitle">Te adoro! </p>
            <div class="heart">🫶🏾❤️</div>
            <div class="media-container">
                <iframe style="border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);" width="100%" height="220"
                    src="https://www.youtube.com/embed/QW0i1U4u0KE" title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>

                <a href="https://open.spotify.com/track/0YBq701BXkMaK6V5UyvOpT" target="_blank" class="spotify-btn">Ou
                    ouvir no Spotify</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
